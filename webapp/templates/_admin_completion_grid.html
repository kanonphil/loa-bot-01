<div class="mg-grid" id="completion-grid">
  <p class="mg-meta"><b class="mg-strong">{{ grid.character_name }}</b> · {{ grid.week_key }} 주 — 난이도를 누르면 완료/취소가 바뀌고 바로 저장됩니다.</p>
  {% for r in grid.rows %}
  <div class="mg-grid-row">
    <span class="mg-grid-raid">{{ r.short_name }}</span>
    <div class="mg-grid-diffs">
      {% for d in r.difficulties %}
      {% set is_done = (r.raid_name ~ "_" ~ d) in grid.done %}
      <form hx-post="/admin/completions/toggle" hx-target="#completion-grid" hx-swap="outerHTML" class="mg-inline">
        <input type="hidden" name="target_discord_id" value="{{ grid.target_discord_id }}">
        <input type="hidden" name="character_name" value="{{ grid.character_name }}">
        <input type="hidden" name="week_key" value="{{ grid.week_key }}">
        <input type="hidden" name="raid_name" value="{{ r.raid_name }}">
        <input type="hidden" name="difficulty" value="{{ d }}">
        <input type="hidden" name="done" value="{{ '0' if is_done else '1' }}">
        <button type="submit" class="chip-btn{% if is_done %} on{% endif %}" aria-pressed="{{ 'true' if is_done else 'false' }}">{{ d }}</button>
      </form>
      {% endfor %}
    </div>
  </div>
  {% endfor %}
</div>
