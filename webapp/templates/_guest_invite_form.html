{% if not result.success %}
<p class="party-cannot-join">{{ result.reason }}</p>
{% elif not result.members %}
<p class="party-cannot-join">초대할 수 있는 미등록 서버 멤버가 없습니다.</p>
{% elif not result.available_slots %}
<p class="party-cannot-join">빈 슬롯이 없습니다.</p>
{% else %}
<form method="post" action="/parties/{{ message_id }}/invite-guest" class="leader-form">
  <select name="target_discord_id" class="js-themed-select" aria-label="초대할 게스트">
    {% for m in result.members %}
    <option value="{{ m.discord_id }}">{{ m.display_name }}</option>
    {% endfor %}
  </select>
  <select name="slot_number" class="js-themed-select" aria-label="슬롯">
    {% for n in result.available_slots %}
    <option value="{{ n }}">{{ n }}번 슬롯</option>
    {% endfor %}
  </select>
  <button type="submit" class="leader-btn" data-busy-text="발송 중…">게스트 초대</button>
</form>
<script>if (window.initThemedSelects) window.initThemedSelects();</script>
{% endif %}
